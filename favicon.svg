<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3BarBros">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#f7b731"/>
      <stop offset="100%" stop-color="#e09b12"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.25"/>
    </filter>
    <g id="fist">
      <rect x="-8" y="-11" width="16" height="22" rx="5" fill="url(#lg)"/>
      <rect x="-10" y="7" width="9" height="6" rx="3" fill="url(#lg)"/>
      <circle cx="5.5" cy="-7.5" r="3.5" fill="url(#lg)"/>
      <circle cx="5.5" cy="-1.5" r="3.5" fill="url(#lg)"/>
      <circle cx="5.5" cy="4.5" r="3.5" fill="url(#lg)"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- fist bump -->
  <g filter="url(#s)">
    <use href="#fist" transform="translate(27 35) rotate(-10 27 35)"/>
    <g transform="translate(37 35)"><g transform="scale(-1 1) rotate(10)"><use href="#fist"/></g></g>
  </g>
  <!-- bump spark -->
  <g stroke="#fff8c4" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M32 25v4"/>
    <path d="M32 41v4"/>
    <path d="M25 33h4"/>
    <path d="M39 33h4"/>
  </g>
</svg>
